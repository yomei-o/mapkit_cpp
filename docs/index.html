<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OSM 地図ビューア（タイル動的読み込み）— mapkit_cpp</title>
<style>
  html,body { margin:0; height:100%; background:#060910; color:#e8eef6;
    font:14px/1.5 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; touch-action:none; cursor:grab; }
  canvas { display:block; width:100%; height:100%; }
  #bar { position:fixed; left:12px; top:12px; display:flex; gap:10px; align-items:center;
    background:rgba(12,17,26,.82); border:1px solid #223047; border-radius:10px; padding:7px 12px; backdrop-filter:blur(6px); }
  #bar b { color:#fff; } #bar button { background:#1a2636; color:#cfe; border:1px solid #2a3b55; border-radius:7px; padding:3px 9px; cursor:pointer; font-size:.82rem; }
  #bar input { background:#0d141e; color:#e8eef6; border:1px solid #2a3b55; border-radius:7px; padding:3px 8px; font-size:.82rem; width:9.5em; }
  #bar input::placeholder { color:#6b7c93; }
  #attr { position:fixed; right:10px; bottom:8px; color:#8da; font-size:.72rem; background:rgba(8,12,18,.7); padding:3px 7px; border-radius:6px; }
  #attr a { color:#9ec8ff; } #hint { position:fixed; left:12px; bottom:10px; color:#90a0b6; font-size:.76rem; }
  #msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#90a0b6; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="bar"><b>OSM 地図</b><input id="addr" placeholder="住所で検索" enterkeyhint="search"><button id="go">検索</button><button id="fit">東京へ</button><button id="here">現在地</button></div>
<div id="hint">ドラッグで移動・ホイール/ピンチで拡大。寄ると細い道と駅名が、引くと都道府県の形が出ます（タイルを動的に読み込み）</div>
<div id="attr">地図データ © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>／住所検索 <a href="https://www.gsi.go.jp/" target="_blank" rel="noopener">国土地理院</a></div>
<div id="msg">読み込み中…</div>
<script src="osm.js"></script>
<script>
let M, cv, ctx, img, W=0, H=0, dpr=1;
const Z = 13;
const $ = id => document.getElementById(id);
function pass(s){ const n=M.lengthBytesUTF8(s)+1, p=M._malloc(n); M.stringToUTF8(s,p,n); return p; }
function size(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width=Math.round(innerWidth*dpr); cv.height=Math.round(innerHeight*dpr);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  W=cv.width; H=cv.height; M._osm_resize(W,H,dpr); img=ctx.createImageData(W,H);
}
function draw(){ const p=M._osm_render(); img.data.set(M.HEAPU8.subarray(p,p+W*H*4)); ctx.putImageData(img,0,0); }

// 見えている欠けタイルを取ってきて渡す
const missing = new Set();
let loading=false, loadAgain=false;
async function loadTiles(){
  if (loading){ loadAgain=true; return; }
  loading=true;
  try {
    const wanted = JSON.parse(M.UTF8ToString(M._osm_wanted()));
    const todo = wanted.filter(([z,x,y]) => !missing.has(z+'/'+x+'/'+y));
    if (todo.length) {
      await Promise.all(todo.map(async ([z,x,y]) => {
        try { const r = await fetch(`tiles/${z}/${x}/${y}.txt`);
          if (!r.ok){ if (r.status===404) missing.add(z+'/'+x+'/'+y); return; }  // 404=本当に無い。503等は再試行
          const t = await r.text(); const p = pass(t); M._osm_tile(z,x,y,p); M._free(p);
        } catch(e){ /* 一時エラーは再試行 */ } }));
      draw();
    }
  } finally {
    loading=false;
    if (loadAgain){ loadAgain=false; loadTiles(); }
  }
}
let loadTimer=0;
function scheduleLoad(){ clearTimeout(loadTimer); loadTimer=setTimeout(loadTiles, 120); }
function changed(){ draw(); scheduleLoad(); }

(async () => {
  const [font, pref, mod] = await Promise.all([
    fetch('font.ttf').then(r=>r.arrayBuffer()).catch(()=>new ArrayBuffer(0)),
    fetch('japan.txt').then(r=>r.text()).catch(()=> ''),
    createOSM()]);
  M = mod; cv = $('cv'); ctx = cv.getContext('2d');
  const fb = new Uint8Array(font), fpp = M._malloc(fb.length); M.HEAPU8.set(fb, fpp);
  M._osm_init(fpp, fb.length); M._free(fpp);
  if (pref){ const pp = pass(pref); M._osm_pref(pp); M._free(pp); }
  $('msg').remove(); size(); M._osm_fit(); draw(); loadTiles();   // サイズ確定後にフィット（scale が決まる）
  window.addEventListener('resize', ()=>{ size(); changed(); });
  $('fit').onclick = ()=>{ M._osm_fit(); changed(); };

  // 現在地（iPhone Safari 向けに高精度オフ＋タイムアウト＋初回取得）
  let gotHere=false;
  if (navigator.geolocation){
    const ok = p => { M._osm_here(p.coords.latitude, p.coords.longitude); gotHere=true; draw(); };
    const opt = { enableHighAccuracy:false, timeout:15000, maximumAge:60000 };
    navigator.geolocation.getCurrentPosition(ok, ()=>{}, opt);
    navigator.geolocation.watchPosition(ok, ()=>{}, opt);
  }
  // 住所検索（国土地理院ジオコーディング、キー不要・CORS許可済み）→ 赤ピン
  async function geocode(q){
    const url = 'https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q);
    const r = await fetch(url); if (!r.ok) return null;
    const list = await r.json(); if (!list.length) return null;
    const [lon, lat] = list[0].geometry.coordinates; return { lon, lat };
  }
  async function doSearch(){
    const q = $('addr').value.trim(); if (!q) return;
    const btn = $('go'); btn.disabled = true;
    try {
      const h = await geocode(q);
      if (!h){ alert('住所が見つかりませんでした（施設名より住所で入れてみてください）'); return; }
      M._osm_mark(h.lat, h.lon); M._osm_goto_mark(); changed();
    } catch(e){ alert('検索に失敗しました: ' + e); }
    finally { btn.disabled = false; }
  }
  $('go').onclick = doSearch;
  $('addr').addEventListener('keydown', e=>{ if (e.key === 'Enter'){ e.preventDefault(); doSearch(); } });

  $('here').onclick = ()=>{
    if (gotHere){ M._osm_goto_here(); changed(); }
    else if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
      p=>{ M._osm_here(p.coords.latitude,p.coords.longitude); gotHere=true; M._osm_goto_here(); changed(); },
      ()=> alert('位置情報が取得できませんでした（設定の位置情報を確認してください）'),
      { enableHighAccuracy:false, timeout:15000, maximumAge:60000 });
  };

  // 操作
  const wrap = $('wrap');
  let down=false, px=0, py=0;
  wrap.addEventListener('pointerdown', e=>{ down=true; px=e.clientX; py=e.clientY; wrap.setPointerCapture(e.pointerId); wrap.style.cursor='grabbing'; });
  wrap.addEventListener('pointermove', e=>{ if(!down) return; M._osm_pan((e.clientX-px)*dpr,(e.clientY-py)*dpr); px=e.clientX; py=e.clientY; changed(); });
  wrap.addEventListener('pointerup', ()=>{ down=false; wrap.style.cursor='grab'; });
  wrap.addEventListener('wheel', e=>{ e.preventDefault(); M._osm_zoom(e.deltaY<0?1.2:1/1.2, e.clientX*dpr, e.clientY*dpr); changed(); }, {passive:false});
  let d0=0;
  wrap.addEventListener('touchmove', e=>{ if(e.touches.length===2){ e.preventDefault();
    const a=e.touches[0], b=e.touches[1], d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(d0){ M._osm_zoom(d/d0,(a.clientX+b.clientX)/2*dpr,(a.clientY+b.clientY)/2*dpr); changed(); }
    d0=d; } }, {passive:false});
  wrap.addEventListener('touchend', ()=> d0=0);
})().catch(err=>{ const m=$('msg'); if(m) m.textContent='読み込みに失敗: '+err; });
</script>
</body>
</html>
